<!--
  NICHELLE IMPORTS 2026 | CONFIGURAÇÃO EDITÁVEL NO PAINEL DA LOJA INTEGRADA
  Instalar em: Visual > Incluir código HTML > Modo avançado
  Tipo: HTML | Página: Página Inicial | Posição: Rodapé
  Este bloco deve carregar ANTES do JS /nichelle27.js, que usa defer.
  NÃO edite as chaves "geral" nem os scripts de checkout.
  Mini Banner: imagens, links, datas, ordem e status são editados em Banners > Mini Banner.
-->
<script>
(function () {
  "use strict";
  var config = window.Nichelle27Settings = window.Nichelle27Settings || {};

  /* 1. VANTAGENS — edite título, descrição, ícone e link.
     Ícones aceitos: package, seal, headset, medal, truck, card, shield, pix. */
  config.vantagens = {
    ativo: true,
    etiqueta: "+VANTAGENS",
    itens: [
      {icone:"package",titulo:"COSMÉTICOS IMPORTADOS",descricao:"À PRONTA ENTREGA",link:""},
      {icone:"seal",titulo:"PRODUTOS 100% ORIGINAIS",descricao:"COM NOTA FISCAL",link:""},
      {icone:"headset",titulo:"ATENDIMENTO PERSONALIZADO",descricao:"COM EQUIPE ESPECIALISTA",link:""},
      {icone:"medal",titulo:"LOJA COM SELO DE VERIFICAÇÃO",descricao:"RECLAME AQUI",link:""}
    ]
  };

  /* 2. MINI BANNER — imagens e links vêm SEMPRE do painel nativo LI.
     "limite" significa quantidade máxima exibida, não cria artes.
     Um banner ativo no painel = um card visível. */
  config.miniBanners = {
    ativo: true,
    limite: 4
  };

  /* 3. SHORTS — administrador pode preencher config.galeriaShorts.itens.
     Aceita YouTube Shorts/watch/embed, Vimeo ou HTML de <iframe>
     dessas duas plataformas, sempre com capa hospedada no CDN da loja.
     Não inserir scripts arbitrários nem iframes de domínios desconhecidos. */
  config.galeriaShorts = config.galeriaShorts || {};
  if (typeof config.galeriaShorts.ativo !== "boolean") config.galeriaShorts.ativo = true;

  // Exemplo: substitua os dados fictícios por URLs REAIS antes de ativar:
  /*
  config.galeriaShorts = {
    ativo: true,
    titulo: "Vídeos da Nichelle",
    exibirPrevia: false,
    configUrl: "",
    itens: [
      {titulo:"Conheça o produto",videoUrl:"https://www.youtube.com/shorts/COLOQUE_ID",
       capa:"https://cdn.awsli.com.br/SEU_CAMINHO/CAPA.jpg"},
      {titulo:"Vídeo vertical",iframe:'<iframe src="https://player.vimeo.com/video/COLOQUE_ID"></iframe>',
       capa:"https://cdn.awsli.com.br/SEU_CAMINHO/CAPA2.jpg"}
    ]
  };
  */

  /* 4. CONTEÚDOS PARA VOCÊ — edite cards de notícias/artigos.
     Links devem ser caminhos existentes da própria loja, como /pagina-do-artigo.
     Imagens podem ser do Gerenciamento de Arquivos (CDN AWSLI). */
  config.noticiasHome = config.noticiasHome || {};
  if (typeof config.noticiasHome.ativo !== "boolean") config.noticiasHome.ativo = true;

  // Exemplo: preencha links e fotos REAIS e só então descomente:
  /*
  config.noticiasHome = {
    ativo:true,
    titulo:"Conteúdos",
    destaque:"para você",
    itens:[
      {foto:"https://cdn.awsli.com.br/SEU_CAMINHO/ARTIGO-1.jpg",
       titulo:"Título do primeiro artigo",
       breveTexto:"Resumo do primeiro artigo",
       data:"2026-11-17",link:"/pagina-do-primeiro-artigo"}
    ]
  };
  */

  ["nichelle27:vantagens:update","nichelle27:mini-banners:update",
   "nichelle27:shorts:update","nichelle27:noticias:update"].forEach(function(name){
     document.dispatchEvent(new Event(name));
   });
})();
</script>
