<!--
NICHELLE IMPORTS 2026 | MODULO ADMINISTRAVEL (FWR)
Instalar em Visual > Incluir codigo HTML > Modo avancado > Rodape.
Preferir TODAS AS PAGINAS para compartilhar o topo/rodape/PDP.
Nao duplicar este bloco nem os loaders globais da loja.
FULLBANNER e MINI BANNER: editar imagens, links, agendamento e ordem
somente no painel nativo da Loja Integrada em Banners.
Visual FWR habilitado somente com ?nichelle_preview=1.
-->
<script id="n27-home-modules-settings">
(function () {
  "use strict";
  var s=window.Nichelle27Settings=window.Nichelle27Settings||{};
  // Configuracao principal preservada do bloco anterior.
  // Necessaria para que o novo HTML substitua o loader antigo por completo.
  // Nunca liga a personalizacao sem o parametro nichelle_preview=1.
  var defaults=function(value,old){
    return Object.assign({},value,old&&typeof old==="object"?old:{});
  };
  s.assetsBase=s.assetsBase||"https://cdn.awsli.com.br/2550/2550587/arquivos/";
  s.geral=defaults(
    {ativo:true,modoPreview:true,publicarNaLoja:false,debug:false,paginas:[]},
    s.geral
  );
  s.layout=defaults(
    {ativo:true,homologado:true,autocriarSlot:true,inserirDepois:".vitrine-produtos",
     seletor:"#n27-layout-root",paginas:["/"]},
    s.layout
  );
  s.visual=defaults({ativo:true,paginas:[]},s.visual);
  s.topo=defaults(
    {ativo:true,seletor:"#cabecalho",fixo:true,faixaAtiva:false,qualificadores:[]},
    s.topo
  );
  s.rodape=defaults({ativo:true,seletor:"#rodape"},s.rodape);
  s.qualificadores=defaults({ativo:false,rotulo:"VANTAGENS",itens:[]},s.qualificadores);
  s.maisVendidos=defaults(
    {ativo:false,titulo:"Produtos",destaque:"Mais Vendidos",seletorFonte:"",
     seletorItem:".listagem-item"},s.maisVendidos
  );
  s.lancamentos=defaults(
    {ativo:false,titulo:"Produtos",destaque:"Lançamentos",seletorFonte:"",
     seletorItem:".listagem-item"},s.lancamentos
  );
  s.marcas=defaults(
    {ativo:false,titulo:"Compre as",destaque:"Melhores Marcas",itens:[]},s.marcas
  );
  s.promocoes=defaults(
    {ativo:false,titulo:"Produtos",destaque:"Promocionais",seletorFonte:"",
     seletorItem:".listagem-item"},s.promocoes
  );
  s.newsletter=defaults(
    {ativo:false,seletorFormulario:"",titulo:"Novidades Nichelle",texto:""},s.newsletter
  );
  s.instagram=defaults(
    {ativo:false,perfil:"",usuario:"@nichelle_imports",itens:[]},s.instagram
  );
  s.empresa=defaults(
    {ativo:false,nome:"Nichelle Imports",logo:"logo-footer.png",
     imagem:"rodape.webp",texto:""},s.empresa
  );
  s.integracoes=defaults({banners:false,videos:true,noticias:false},s.integracoes);

  // Compatibilidade com o player legado existente, quando instalado.
  // Seu JSON de producao segue publicado com galeria desativada.
  window.FWRNichelle=window.FWRNichelle||{};
  if(!window.FWRNichelle.galeriaVideos){
    window.FWRNichelle.galeriaVideos={
      ativo:true,
      configUrl:"https://nichelle-2026-git-develop-fwragenciadigitals-projects.vercel.app/galeria-publicada.json"
    };
  }

  // 1. FULLBANNER — vinculado a Banners > Full Banner no painel LI.
  s.fullBanners={
    ativo:true,
    autoplay:true,
    intervalo:6500,
    limite:12
  };

  // 2. BENEFICIOS / VANTAGENS — textos editados neste mesmo HTML.
  // Icones aceitos: package, seal, headset, medal, truck, card, shield, pix.
  s.vantagens={
    ativo:true,
    etiqueta:"+VANTAGENS",
    itens:[
      {icone:"package",titulo:"COSMÉTICOS IMPORTADOS",descricao:"À PRONTA ENTREGA",link:""},
      {icone:"seal",titulo:"PRODUTOS 100% ORIGINAIS",descricao:"COM NOTA FISCAL",link:""},
      {icone:"headset",titulo:"ATENDIMENTO PERSONALIZADO",descricao:"COM EQUIPE ESPECIALISTA",link:""},
      {icone:"medal",titulo:"LOJA COM SELO DE VERIFICAÇÃO",descricao:"RECLAME AQUI",link:""}
    ]
  };

  // 3. MINI BANNER — vinculado a Banners > Mini Banner no painel LI.
  // So 1 banner publicado -> somente 1 card visivel.
  s.miniBanners={ativo:true,limite:4};

  // 4. SHORTS — preencha as URLs reais de YouTube, Vimeo ou iframe.
  // Capa no Gerenciador de Arquivos; Vimeo precisa capa cadastrada.
  // Nao ha video real no galeria-publicada.json atual.
  s.galeriaShorts={
    ativo:true,
    titulo:"Shorts",
    exibirPrevia:false,
    configUrl:"",
    itens:[
      {titulo:"Short 01",videoUrl:"",iframe:"",capa:""},
      {titulo:"Short 02",videoUrl:"",iframe:"",capa:""},
      {titulo:"Short 03",videoUrl:"",iframe:"",capa:""},
      {titulo:"Short 04",videoUrl:"",iframe:"",capa:""}
    ]
  };
  // Exemplo: videoUrl:"https://www.youtube.com/shorts/ID_REAL"
  // Exemplo: iframe:'<iframe src="https://player.vimeo.com/video/ID_REAL"></iframe>'

  // 5. CONTEUDOS PARA VOCE — os 3 textos/imagens do projeto original.
  // Preencha link SOMENTE apos a publicacao da pagina real do artigo.
  s.noticiasHome={
    ativo:true,
    titulo:"Conteúdos",
    destaque:"para você",
    itens:[
      {
        foto:"https://cdn.awsli.com.br/2550/2550587/arquivos/coreana.jpg",
        titulo:"SKINCARE COREANO: A ROTINA DE BELEZA K-BEAUTY EM 10 PASSOS",
        breveTexto:"Descubra os 10 passos da rotina de skincare coreana para uma pele radiante e saudável.",
        data:"2026-10-01",
        link:""
      },
      {
        foto:"https://cdn.awsli.com.br/2550/2550587/arquivos/coreana1.jpg",
        titulo:"NAD+ NO SKINCARE: O QUE É E POR QUE ESTÁ GANHANDO DESTAQUE?",
        breveTexto:"O skincare coreano está cada vez mais conectado à biotecnologia. Entre os ingredientes que vêm despertando curiosidade está o NAD...",
        data:"2026-09-25",
        link:""
      },
      {
        foto:"https://cdn.awsli.com.br/300x300/2550/2550587/produto/398845857/centella-water-fit-sun-01-j0900wdoft.jpg",
        titulo:"PROTETOR SOLAR NO INVERNO: POR QUE ELE CONTINUA SENDO O ÚLTIMO PASSO DA ROTINA K-BEAUTY",
        breveTexto:"No inverno, a rotina de skincare costuma mudar: a pele pede texturas mais confortáveis, limpeza mais gentil e hidratação reforçada. Mas existe um passo que não...",
        data:"2026-08-11",
        link:""
      }
    ]
  };

  // Loader de protecao: se nichelle27.js/css ja estiverem na loja,
  // nao cria requisicoes ou execucoes duplicadas.
  var preview=/^(www\.)?nichelleimports\.com\.br$/i.test(location.hostname)&&
    new URLSearchParams(location.search).get("nichelle_preview")==="1";
  if(preview){
    var base="https://nichelle-2026-git-develop-fwragenciadigitals-projects.vercel.app";
    if(!document.querySelector('link[href*="/nichelle27.css"]')){
      var css=document.createElement("link");
      css.rel="stylesheet";css.href=base+"/nichelle27.css";
      document.head.appendChild(css);
    }
    if(!document.querySelector('script[src*="/nichelle27.js"]')){
      var js=document.createElement("script");
      js.src=base+"/nichelle27.js";
      js.async=false;
      (document.body||document.head).appendChild(js);
    }
  }

  function refresh(){
    ["nichelle27:full-banners:update","nichelle27:vantagens:update",
     "nichelle27:mini-banners:update","nichelle27:shorts:update",
     "nichelle27:noticias:update"].forEach(function(name){
       document.dispatchEvent(new Event(name));
     });
  }
  if(document.readyState==="loading")
    document.addEventListener("DOMContentLoaded",refresh,{once:true});
  else refresh();
  window.addEventListener("load",refresh,{once:true});
})();
</script>
