<!-- NICHELLE 2026 | GALERIA DE YOUTUBE SHORTS
     Cole este bloco no HTML editável da seção EXCLUSIVA da FWR.
     O CSS fica aqui para reservar espaço antes do JavaScript externo.
     O loader único é configurado uma vez em integracao/rodape-loader.html.
     Não copiar para HTML de vitrines/carrinho/checkout nativos. -->

<style>
#fwr-nichelle-video-slot{box-sizing:border-box;width:100%;max-width:1440px;margin-inline:auto}
#fwr-nichelle-video-slot[data-fwr-active="1"]{min-height:clamp(430px,calc(130vw + 75px),650px)}
#fwr-nichelle-video-slot .fwr-nichelle-videos{padding:20px 18px 38px}
#fwr-nichelle-video-slot .fwr-nichelle-videos *{box-sizing:border-box}
#fwr-nichelle-video-slot .fwr-nichelle-videos__track{display:grid;grid-auto-flow:column;grid-auto-columns:min(76vw,310px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 0 12px}
#fwr-nichelle-video-slot .fwr-nichelle-videos__card{appearance:none;position:relative;display:block;width:100%;aspect-ratio:9/16;border:0;border-radius:20px;overflow:hidden;background:#ded8dc;cursor:pointer;scroll-snap-align:start;padding:0}
#fwr-nichelle-video-slot .fwr-nichelle-videos__poster{display:block;width:100%;height:100%;object-fit:cover}
#fwr-nichelle-video-slot .fwr-nichelle-videos__card::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.20);pointer-events:none}
#fwr-nichelle-video-slot .fwr-nichelle-videos__play{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 2px 4px #3335)}
#fwr-nichelle-video-slot .fwr-nichelle-videos__play svg{display:block;width:46px;height:46px;fill:#fff}
#fwr-nichelle-video-slot .fwr-nichelle-videos__fallback{position:absolute;z-index:1;bottom:10px;left:12px;right:12px;padding:8px;background:#161616c9;color:white;text-align:center;font:500 12px/1.4 Arial,sans-serif;border-radius:8px}
#fwr-nichelle-video-slot .fwr-nichelle-videos__fallback[hidden]{display:none}
#fwr-nichelle-video-slot .fwr-nichelle-videos__card:focus-visible{outline:3px solid #fff;outline-offset:-5px}
@media (min-width:768px){
  #fwr-nichelle-video-slot[data-fwr-active="1"]{min-height:clamp(420px,calc(42vw + 72px),700px)}
  #fwr-nichelle-video-slot .fwr-nichelle-videos{padding:28px 24px 42px}
  #fwr-nichelle-video-slot .fwr-nichelle-videos__track{grid-auto-flow:row;grid-auto-columns:auto;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.8vw,30px);overflow:visible;scroll-snap-type:none}
}
.fwr-nichelle-video-modal{position:fixed;inset:0;z-index:2147482000;background:#000d;display:grid;place-items:center;padding:20px}
.fwr-nichelle-video-modal__dialog{position:relative;width:min(450px,92vw);height:min(80vh,800px);aspect-ratio:9/16;border-radius:16px;background:#111}
.fwr-nichelle-video-modal__media{display:block;width:100%;height:100%;border:0;border-radius:16px}
.fwr-nichelle-video-modal__close{position:absolute;z-index:2;right:-12px;top:-12px;width:40px;height:40px;border:0;border-radius:50%;background:white;color:#111;font-size:25px;cursor:pointer}
</style>

<div id="fwr-nichelle-video-slot" data-fwr-active="0"></div>

<script>
/* EDITAR SOMENTE AQUI. Cole os links dos Shorts nas aspas.
   Formatos aceitos: youtube.com/shorts/ID, youtube.com/watch?v=ID, youtu.be/ID.
   Ativo = true para exibir; false para ocultar (sem espaço vazio). */
window.FWRNichelle = window.FWRNichelle || {};
window.FWRNichelle.galeriaVideos = {
  ativo: false,
  shorts: [
    "",  /* Vídeo 1 */
    "",  /* Vídeo 2 */
    "",  /* Vídeo 3 */
    ""   /* Vídeo 4 */
  ]
};

/* Reserva visual criada durante o parsing do HTML, antes do JS do Git.
   Com módulo inativo o espaço não é reservado. */
(function () {
  var cfg = window.FWRNichelle.galeriaVideos;
  var slot = document.getElementById("fwr-nichelle-video-slot");
  if (!slot) return;
  var preenchidos = Array.isArray(cfg.shorts) && cfg.shorts.some(function (v) {
    return typeof v === "string" ? v.trim() !== "" : v && typeof v.url === "string" && v.url.trim() !== "";
  });
  slot.setAttribute("data-fwr-active", cfg.ativo === true && preenchidos ? "1" : "0");
})();
</script>
