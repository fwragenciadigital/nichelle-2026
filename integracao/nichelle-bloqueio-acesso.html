<script id="n27-acesso-controle">
(function(){
  "use strict";
  if(window.__N27AcessoControleInstalado)return;
  window.__N27AcessoControleInstalado=true;

  /* ===========================================================
     VARIAVEIS EDITAVEIS: ALTERE SOMENTE ESTES VALORES
     =========================================================== */
  var BLOQUEIO_ATIVO = true;
  var CODIGO_ACESSO = "ALTERE-ESTE-CODIGO";
  var TEMPO_LIBERADO_HORAS = 12;
  /* =========================================================== */

  // Somente os dois enderecos autorizados da Nichelle.
  var DOMINIOS = [
    "nichelleimports.com.br",
    "www.nichelleimports.com.br",
    "nichelle-imports-manutencao.lojaintegrada.com.br"
  ];
  // Nao bloquear pagamento/autenticacao e endpoints de operacoes da LI.
  var ROTAS_LIVRES = [
    "/checkout", "/finalizar-pedido", "/login", "/conta",
    "/pedido", "/meus-pedidos", "/carrinho/produto",
    "/carrinho/cupom", "/carrinho/frete", "/carrinho/checkout"
  ];

  var host=location.hostname.toLowerCase();
  var path=location.pathname.toLowerCase().replace(/\/+$/,"")||"/";
  var liberada=ROTAS_LIVRES.some(function(route){
    return path===route||path.indexOf(route+"/")===0;
  });
  var codigo=String(CODIGO_ACESSO||"").trim().toUpperCase();
  if(!BLOQUEIO_ATIVO||DOMINIOS.indexOf(host)<0||liberada||!codigo)return;

  // Identificador so para invalidar acessos antigos ao alterar a variavel.
  // Nao e um mecanismo criptografico de seguranca.
  function assinatura(value){
    var h=2166136261;
    for(var i=0;i<value.length;i++){
      h^=value.charCodeAt(i);
      h=Math.imul(h,16777619);
    }
    return (h>>>0).toString(36);
  }
  var versao=assinatura(codigo),chave="n27-nichelle-acesso-v1-"+host;
  function persistido(){
    try{
      var dado=JSON.parse(localStorage.getItem(chave)||"null");
      return !!(dado&&dado.versao===versao&&
        Number.isFinite(dado.expira)&&dado.expira>Date.now());
    }catch(_){return false;}
  }
  if(persistido())return;

  document.documentElement.setAttribute("data-n27-acesso","bloqueado");
  function montar(){
    if(document.getElementById("n27-acesso-tela"))return;
    if(!document.body)return;
    var root=document.createElement("div");
    root.id="n27-acesso-tela";
    root.innerHTML=
      '<main class="n27-acesso-card" role="dialog" aria-modal="true" aria-labelledby="n27-acesso-titulo">'+
        '<section class="n27-acesso-info">'+
          '<div class="n27-acesso-marca" aria-label="Nichelle Imports">NICHELLE <small>IMPORTS</small></div>'+
          '<div class="n27-acesso-info-text">'+
            '<span class="n27-acesso-etiqueta">Novidades em breve</span>'+
            '<h2 id="n27-acesso-titulo">Estamos preparando uma nova experiência.</h2>'+
            '<p class="n27-acesso-descricao">Nossa loja está recebendo melhorias. O acesso temporário está disponível para quem possui o código autorizado.</p>'+
          '</div>'+
        '</section>'+
        '<section class="n27-acesso-form-area">'+
          '<div class="n27-acesso-icon" aria-hidden="true">'+
            '<svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+
              '<rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path>'+
            '</svg>'+
          '</div>'+
          '<h3>Acesso autorizado</h3>'+
          '<p class="n27-acesso-ajuda">Insira o seu código para explorar a loja.</p>'+
          '<form id="n27-acesso-form" autocomplete="off" novalidate>'+
            '<label for="n27-acesso-codigo" class="n27-acesso-label">Código de acesso</label>'+
            '<input id="n27-acesso-codigo" type="password" autocomplete="off" placeholder="Digite o seu código" required aria-describedby="n27-acesso-erro" />'+
            '<button id="n27-acesso-enviar" type="submit">Entrar na loja</button>'+
            '<p id="n27-acesso-erro" role="status" aria-live="polite"></p>'+
          '</form>'+
          '<p class="n27-acesso-rodape">Acesso temporário · Nichelle Imports</p>'+
        '</section>'+
      '</main>';
    document.body.appendChild(root);
    var form=root.querySelector("#n27-acesso-form");
    var input=root.querySelector("#n27-acesso-codigo");
    var erro=root.querySelector("#n27-acesso-erro");
    form.addEventListener("submit",function(ev){
      ev.preventDefault();
      var recebido=String(input.value||"").trim().toUpperCase();
      if(recebido!==codigo){
        erro.textContent="Código incorreto. Confira e tente novamente.";
        input.setAttribute("aria-invalid","true");
        input.focus();input.select();
        return;
      }
      try{
        var horas=Math.min(168,Math.max(1,Number(TEMPO_LIBERADO_HORAS)||12));
        localStorage.setItem(chave,JSON.stringify({
          versao:versao,
          expira:Date.now()+horas*60*60*1000
        }));
      }catch(_){}
      document.documentElement.removeAttribute("data-n27-acesso");
      root.remove();
    });
    input.addEventListener("input",function(){
      erro.textContent="";
      input.removeAttribute("aria-invalid");
    });
  }
  if(document.body)montar();
  else document.addEventListener("DOMContentLoaded",montar,{once:true});
  window.addEventListener("load",montar,{once:true});
})();
</script>
