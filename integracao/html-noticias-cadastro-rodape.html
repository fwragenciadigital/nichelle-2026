  itens: [
    {
      foto: "",        // URL https da imagem, preferencialmente 1200 x 810 px

      data: "",        // AAAA-MM-DD. Ex.: 2026-11-09
      link: ""         // URL da página de conteúdo da Loja Integrada
    },
    {
      foto: "",        // URL https da imagem, preferencialmente 700 x 500 px
      titulo: "",      // Título da notícia lateral 1

      data: "",
      link: ""
    },
    {
      foto: "",        // URL https da imagem, preferencialmente 700 x 500 px
      titulo: "",      // Título da notícia lateral 2
      breveTexto: "",
      data: "",
      link: ""
    }
  ]
};
// Atualiza a seção mesmo quando a Loja Integrada carregar este HTML após o JS.
document.dispatchEvent(new Event("fwr:nichelle:news-config"));
</script>
