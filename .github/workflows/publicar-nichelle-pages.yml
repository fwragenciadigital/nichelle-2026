name: Nichelle - Publicar JS via GitHub Pages (opcional)

on:
  push:
    branches: [main]
    paths:
      - 'public/nichelle.js'
      - '.github/workflows/publicar-nichelle-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nichelle-pages
  cancel-in-progress: false

jobs:
  pages:
    if: ${{ vars.FWR_NICHELLE_PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar runtime
        run: node --check public/nichelle.js
      - name: Publicar apenas o JS de frontend (nunca painel/segredos)
        run: |
          mkdir -p _site
          cp public/nichelle.js _site/nichelle.js
          printf 'Nichelle JS asset\n' > _site/index.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
